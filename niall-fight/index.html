<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Niall Fight</title>
    <link rel="stylesheet" href="../style.css?v=fbd9bab6b80e" />
  </head>
  <body class="battle-body">
    <main class="battle-shell" aria-label="Turn-based battle with Niall">
      <section class="battle-stage">
        <div class="battle-card enemy-card">
          <div class="battle-name-row">
            <h1>NIALL</h1>
            <span>:L19</span>
          </div>
          <div class="battle-hp-row">
            <span>HP:</span>
            <meter id="niall-hp" min="0" max="70" value="70"></meter>
          </div>
          <p><strong id="niall-hp-text">70</strong>/70</p>
        </div>

        <img id="niall-battler" class="battle-sprite enemy-sprite" src="../img/battle/niall-avatar.png?v=20260901-rebuilt" alt="Niall">
        <div id="niall-opening-damage" class="battle-damage" aria-live="polite" hidden>-10</div>
        <div id="player-opening-damage" class="battle-damage player-opening-damage" aria-live="polite" hidden>-10</div>
        <img id="player-battler" class="battle-sprite player-sprite" src="../img/battle/max-avatar.png" alt="Player">

        <div class="battle-card player-card">
          <div class="battle-name-row">
            <h2>PLAYER</h2>
            <span>:L25</span>
          </div>
          <div class="battle-hp-row">
            <span>HP:</span>
            <meter id="player-hp" min="0" max="80" value="80"></meter>
          </div>
          <p><strong id="player-hp-text">80</strong>/80</p>
          <p id="fomo-status" class="battle-status"></p>
        </div>
      </section>

      <section class="battle-console">
        <div id="battle-log" class="battle-log" aria-live="polite">A wild NIALL appeared.</div>
        <div id="move-grid" class="move-grid" aria-label="Battle actions" hidden>
          <button type="button" data-action="attack">Attack</button>
          <button type="button" data-action="run">Run</button>
          <button type="button" data-action="items">Items</button>
          <button type="button" data-action="wait">Wait</button>
        </div>
        <div id="opening-grid" class="move-grid" aria-label="Battle opening">
          <button id="opening-next" class="full-row" type="button">Next &gt;</button>
        </div>
        <div id="item-grid" class="move-grid item-grid" aria-label="Battle items" hidden>
          <button type="button" data-item="vape">Vape</button>
          <button type="button" data-item="capri-sun">Capri Sun (+50 HP)</button>
          <button type="button" data-item="pocket-lint">Pocket lint</button>
          <button class="full-row" type="button" data-action="back">Back</button>
        </div>
        <a id="bus-link" class="bus-link" href="../index.html?niall=bus" hidden>Walk to the bus</a>
      </section>
    </main>
    <script src="../dist/niall-fight-bundle.js?v=cf7a6ac30f83"></script>
  </body>
</html>

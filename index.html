<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Max's Overworld</title>
    <link rel="stylesheet" href="style.css?v=20261006-remove-reset" />
  </head>
  <body>
    <main class="game-shell">
      <canvas id="game" width="480" height="480" aria-label="Overworld game map"></canvas>
      <button id="tim-cutscene-next" class="tim-cutscene-next" type="button" hidden>Next &gt;</button>
      <div class="top-actions">
        <button id="music-toggle" class="music-toggle" type="button" aria-expanded="false" aria-controls="music-panel">
          ♪ Music
        </button>
        <button id="audio-mute-toggle" class="audio-mute-toggle" type="button" aria-pressed="false">
          <svg class="mute-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path d="M1 6h3l4-3v10l-4-3H1z" fill="currentColor" />
            <path class="mute-icon-waves" d="M10 5h1v1h1v4h-1v1h-1v-1h1V6h-1zm2-2h1v1h1v8h-1v1h-1v-1h1V4h-1z" fill="currentColor" />
            <path class="mute-icon-cross" d="m10 5 4 6m0-6-4 6" stroke="currentColor" stroke-width="2" />
          </svg>
          <span class="audio-mute-label">Mute</span>
        </button>
        <button id="inventory-toggle" class="inventory-toggle" type="button" aria-expanded="false" aria-controls="inventory-panel">
          Inventory <span class="inventory-count">1</span>
        </button>
      </div>
      <section id="music-panel" class="music-panel" aria-label="Music player" hidden>
        <div class="music-header">
          <h2>Music player</h2>
          <button id="music-close" class="music-close" type="button" aria-label="Close music player">×</button>
        </div>
        <div id="music-controls-group">
          <label class="music-select-label" for="music-select">Choose a song</label>
          <select id="music-select" class="music-select">
            <option value="">Select a song</option>
          </select>
          <div class="music-controls">
            <button id="music-play-pause" class="music-play-pause" type="button" disabled>Play</button>
            <label class="music-volume" for="music-volume">
              <span>Volume</span>
              <input id="music-volume" type="range" min="0" max="1" step="0.01" value="0.7" />
            </label>
          </div>
        </div>
        <p id="music-status" class="music-status" aria-live="polite">Choose a song to start playing.</p>
      </section>
      <div id="powerup-status" class="powerup-status" hidden></div>
      <button id="bus-intro-skip" class="bus-intro-skip" type="button" hidden>⏩ Skip intro</button>
      <button id="jump-toggle" class="jump-toggle" type="button" aria-expanded="false" aria-controls="jump-panel">Jump</button>
      <section id="jump-panel" class="jump-panel" aria-label="Jump to room" hidden>
        <div class="jump-header">
          <h2>Jump</h2>
          <button id="jump-close" class="jump-close" type="button" aria-label="Close jump menu">×</button>
        </div>
        <div id="jump-options" class="jump-options"></div>
      </section>
      <section id="sign-dialogue" class="sign-dialogue" aria-live="polite" hidden>
        <div class="sign-dialogue-heading">
          <span class="sign-dialogue-icon" aria-hidden="true">!</span>
          <h2 id="sign-dialogue-title">Sign</h2>
        </div>
        <p id="sign-dialogue-text"></p>
        <div id="sign-dialogue-signature" class="sign-dialogue-signature" hidden>
          <img id="sign-dialogue-signature-image" src="img/external/signature.png" alt="Max's signature">
          <img id="sign-dialogue-bus-image" src="img/external/bus.png" alt="Bus" hidden>
        </div>
      </section>
      <section id="npc-dialogue" class="npc-dialogue" aria-live="polite" hidden>
        <header class="npc-dialogue-header">
          <h2 id="npc-speaker"></h2>
          <button id="npc-dialogue-close" class="npc-dialogue-close" type="button" aria-label="Close dialogue">×</button>
        </header>
        <div class="dialogue-line-row">
          <img id="npc-dialogue-profile" class="dialogue-profile" alt="" hidden>
          <p id="npc-dialogue-line"></p>
          <span id="npc-dialogue-progress" class="dialogue-progress" aria-live="polite"></span>
        </div>
        <p id="npc-gift-confirmation" class="dialogue-gift-confirmation" hidden></p>
        <button id="npc-dialogue-next" class="npc-dialogue-next" type="button" aria-label="Next dialogue line" hidden>&gt;</button>
        <button id="rei-dialogue-lines-button" class="npc-dialogue-next rei-dialogue-lines-button" type="button" aria-label="Show next Rei dialogue line" hidden>See next dialogue</button>
        <div id="oscar-dialogue-options" class="npc-dialogue-options" hidden>
          <button type="button">Yes</button>
          <button type="button">No</button>
        </div>
        <div id="alice-dialogue-options" class="npc-dialogue-options" hidden>
          <a id="alice-event-tinder-link" href="https://maxbye.co/event-tinder" target="_blank" rel="noopener noreferrer">check it out</a>
          <button id="alice-event-tinder-dismiss" type="button">not now</button>
        </div>
      </section>
      <section id="niall-dialogue" class="npc-dialogue" aria-live="polite" hidden>
        <header class="npc-dialogue-header"><h2>Niall</h2></header>
        <div class="dialogue-line-row">
          <img class="dialogue-profile" src="chat/niall/player/profile.png" alt="Niall">
          <p id="niall-dialogue-line"></p>
        </div>
        <button id="niall-dialogue-next" class="npc-dialogue-next" type="button" aria-label="Next dialogue line">&gt;</button>
      </section>
      <section id="inventory-panel" class="inventory-panel" aria-label="Inventory" hidden>
        <div class="inventory-header">
          <h2>Inventory</h2>
          <button id="inventory-delete-all" class="inventory-delete-all" type="button">Delete all</button>
          <button id="inventory-close" class="inventory-close" type="button" aria-label="Close inventory">×</button>
        </div>
        <div id="gift-items" class="gift-items" aria-label="Collected gifts"></div>
        <p id="inventory-message" class="inventory-message"></p>
      </section>
      <div class="controls">
        <div class="dpad" role="group" aria-label="Movement controls">
          <button class="dpad-button up-left" data-directions="up left" aria-label="Move up and left">◸</button>
          <button class="dpad-button" data-directions="up" aria-label="Move up">△</button>
          <button class="dpad-button up-right" data-directions="up right" aria-label="Move up and right">◹</button>
          <button class="dpad-button" data-directions="left" aria-label="Move left">◁</button>
          <span class="dpad-center" aria-hidden="true"></span>
          <button class="dpad-button" data-directions="right" aria-label="Move right">▷</button>
          <button class="dpad-button down-left" data-directions="down left" aria-label="Move down and left">◺</button>
          <button class="dpad-button" data-directions="down" aria-label="Move down">▽</button>
          <button class="dpad-button down-right" data-directions="down right" aria-label="Move down and right">◿</button>
        </div>
        <span class="keyboard-hint"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or arrow keys</span>
      </div>
      <p id="announcer" class="visually-hidden" role="status" aria-live="polite"></p>
    </main>
    <script src="dist/main-bundle.js?v=20261006-sync-chat-dialogues"></script>
  </body>
</html>

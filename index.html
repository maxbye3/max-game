<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Max's Overworld</title>
    <link rel="stylesheet" href="style.css?v=20260825-controls-right" />
  </head>
  <body>
    <main class="game-shell">
      <canvas id="game" width="480" height="480" aria-label="Overworld game map"></canvas>
      <button id="inventory-toggle" class="inventory-toggle" type="button" aria-expanded="false" aria-controls="inventory-panel">
        Inventory <span class="inventory-count">1</span>
      </button>
      <div id="powerup-status" class="powerup-status" hidden></div>
      <section id="sign-dialogue" class="sign-dialogue" aria-live="polite" hidden>
        <div class="sign-dialogue-heading">
          <span class="sign-dialogue-icon" aria-hidden="true">!</span>
          <h2 id="sign-dialogue-title">Sign</h2>
        </div>
        <p id="sign-dialogue-text"></p>
      </section>
      <button id="mike-talk" class="npc-talk" type="button" hidden>Talk to mike</button>
      <button id="niall-fight-start" class="npc-talk niall-fight-start" type="button" hidden>Fight Niall</button>
      <section id="mike-dialogue" class="npc-dialogue" aria-live="polite" hidden>
        <header class="npc-dialogue-header">
          <h2 id="mike-speaker"></h2>
          <button id="mike-dialogue-close" class="npc-dialogue-close" type="button" aria-label="Close dialogue">×</button>
        </header>
        <p id="mike-dialogue-line"></p>
      </section>
      <section id="inventory-panel" class="inventory-panel" aria-label="Inventory" hidden>
        <div class="inventory-header">
          <h2>Inventory</h2>
          <button id="inventory-close" class="inventory-close" type="button" aria-label="Close inventory">×</button>
        </div>
        <button id="inventory-item" class="inventory-item" type="button" aria-expanded="false" aria-controls="item-actions">
          <img src="player/item.png" alt="Suspiciously powerful sandwich" />
          <span class="item-text">
            <strong>Power Sandwich</strong>
            <small id="item-status">Ready to use</small>
          </span>
          <span id="ready-badge" class="ready-badge">Ready</span>
        </button>
        <div class="recharge-track" aria-hidden="true"><span id="recharge-fill"></span></div>
        <div id="item-actions" class="item-actions" hidden>
          <p>Makes the protagonist move 60% faster for 10 seconds.</p>
          <button id="use-item" type="button">Use item</button>
        </div>
        <p id="inventory-message" class="inventory-message"></p>
      </section>
      <div class="controls">
        <div class="dpad" role="group" aria-label="Movement controls">
          <button class="dpad-button up-left" data-directions="up left" aria-label="Move up and left">◸</button>
          <button class="dpad-button" data-directions="up" aria-label="Move up">△</button>
          <button class="dpad-button up-right" data-directions="up right" aria-label="Move up and right">◹</button>
          <button class="dpad-button" data-directions="left" aria-label="Move left">◁</button>
          <span class="dpad-center" aria-hidden="true"></span>
          <button class="dpad-button" data-directions="right" aria-label="Move right">▷</button>
          <button class="dpad-button down-left" data-directions="down left" aria-label="Move down and left">◺</button>
          <button class="dpad-button" data-directions="down" aria-label="Move down">▽</button>
          <button class="dpad-button down-right" data-directions="down right" aria-label="Move down and right">◿</button>
        </div>
        <span class="keyboard-hint"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or arrow keys</span>
      </div>
      <p id="announcer" class="visually-hidden" role="status" aria-live="polite"></p>
    </main>
    <script src="dist/main-bundle.js"></script>
  </body>
</html>

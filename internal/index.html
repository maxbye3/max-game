<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Diary & Laboratory</title>
    <link rel="stylesheet" href="../style.css?v=20260831-dialogue-next" />
    <style>
      .interior-exit {
        position: absolute;
        z-index: 8;
        top: 24px;
        left: 24px;
        padding: 10px 12px;
        border: 1px solid rgb(255 255 255 / 35%);
        border-radius: 10px;
        color: var(--text);
        background: rgb(var(--panel-rgb) / 88%);
        font: 10px/1.4 var(--font-pixel);
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main class="game-shell">
      <canvas id="game" width="480" height="480" aria-label="Diary and Laboratory interior"></canvas>
      <a class="interior-exit" href="../index.html">Exit</a>
      <button id="interaction-prompt" class="npc-talk" type="button" hidden>Interact</button>
      <section id="noel-dialogue" class="npc-dialogue" aria-live="polite" hidden>
        <header class="npc-dialogue-header">
          <h2 id="noel-speaker"></h2>
          <button id="noel-dialogue-close" class="npc-dialogue-close" type="button" aria-label="Close dialogue">×</button>
        </header>
        <p id="noel-dialogue-line"></p>
        <button id="noel-dialogue-next" class="npc-dialogue-next" type="button" hidden>Next</button>
        <p id="noel-dialogue-question" class="npc-dialogue-question" hidden></p>
        <div id="noel-dialogue-options" class="npc-dialogue-options" hidden>
          <button id="noel-read-diary" type="button" data-noel-choice="diary">Read diary</button>
          <button id="noel-view-experiments" type="button" data-noel-choice="experiments">Checkout experiments</button>
          <button id="noel-decline" type="button" data-noel-choice="decline">Neh. I'm good</button>
        </div>
        <div id="siblings-dialogue-options" class="npc-dialogue-options" hidden>
          <a id="siblings-view-website" href="https://siblingscomedy.com/" target="_blank" rel="noopener noreferrer">View website</a>
          <button id="siblings-decline" type="button">Neh. I'm good</button>
        </div>
      </section>
      <section id="diary-panel" class="internal-feature-panel" role="dialog" aria-modal="true" aria-labelledby="diary-title" hidden>
        <header class="internal-feature-header">
          <h2 id="diary-title">Max's diary</h2>
          <button class="internal-feature-close" type="button" aria-label="Close diary">×</button>
        </header>
        <p>The contents of my diary are quite personal so you'll need to know my phone number to see it:</p>
        <form id="diary-unlock-form" class="diary-unlock-form">
          <label for="diary-password">Phone number</label>
          <input id="diary-password" type="password" inputmode="numeric" autocomplete="off" pattern="[0-9]*" required>
          <button type="submit">Unlock diary</button>
        </form>
        <p id="diary-unlock-message" class="diary-unlock-message" role="status"></p>
        <a id="diary-link" class="diary-link" href="https://photos.app.goo.gl/RCJ28tWK77zQt1GZ7" target="_blank" rel="noopener noreferrer" hidden>Open the diary</a>
      </section>
      <section id="experiments-panel" class="internal-feature-panel" role="dialog" aria-modal="true" aria-labelledby="experiments-title" hidden>
        <header class="internal-feature-header">
          <h2 id="experiments-title">Experiments</h2>
          <button class="internal-feature-close" type="button" aria-label="Close experiments">×</button>
        </header>
        <p>Pick a test image to inspect it full screen.</p>
        <div class="experiment-gallery">
          <button type="button" data-experiment-src="../chat/noel/player/profile.png">
            <img src="../chat/noel/player/profile.png" alt="Noel profile test">
            <span>Profile test</span>
          </button>
          <button type="button" data-experiment-src="../chat/noel/player/item.png">
            <img src="../chat/noel/player/item.png" alt="Noel item test">
            <span>Item test</span>
          </button>
          <button type="button" data-experiment-src="../chat/noel/avatar.png">
            <img src="../chat/noel/avatar.png" alt="Noel avatar test">
            <span>Avatar test</span>
          </button>
        </div>
      </section>
      <dialog id="experiment-lightbox" class="experiment-lightbox" aria-label="Expanded experiment image">
        <button id="experiment-lightbox-close" type="button" aria-label="Close full-screen image">×</button>
        <img id="experiment-lightbox-image" alt="">
      </dialog>
      <div class="controls">
        <div class="dpad" role="group" aria-label="Movement controls">
          <button class="dpad-button up-left" data-directions="up left" aria-label="Move up and left">◸</button>
          <button class="dpad-button" data-directions="up" aria-label="Move up">△</button>
          <button class="dpad-button up-right" data-directions="up right" aria-label="Move up and right">◹</button>
          <button class="dpad-button" data-directions="left" aria-label="Move left">◁</button>
          <span class="dpad-center" aria-hidden="true"></span>
          <button class="dpad-button" data-directions="right" aria-label="Move right">▷</button>
          <button class="dpad-button down-left" data-directions="down left" aria-label="Move down and left">◺</button>
          <button class="dpad-button" data-directions="down" aria-label="Move down">▽</button>
          <button class="dpad-button down-right" data-directions="down right" aria-label="Move down and right">◿</button>
        </div>
        <span class="keyboard-hint"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or arrow keys</span>
      </div>
    </main>
    <script src="../dist/internal-bundle.js?v=20260901-sibling-website"></script>
  </body>
</html>

name: Refresh Letterboxd reviews

on:
  schedule:
    - cron: '23,53 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-letterboxd-reviews.mjs
      - run: |
          if git diff --quiet -- data/letterboxd-reviews.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/letterboxd-reviews.json
          git commit -m 'Refresh Letterboxd reviews'
          git push

name: Refresh Goodreads reading list

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-goodreads-read.mjs
      - run: |
          if git diff --quiet -- data/goodreads-read.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/goodreads-read.json
          git commit -m 'Refresh Goodreads reading list'
          git push

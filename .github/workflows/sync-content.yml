name: Refresh external content

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-external-content
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: sync
        run: npm run sync:content
      # Publish successful feeds even when another provider is unavailable.
      - if: success() || steps.sync.outcome == 'failure'
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          git commit -m 'Refresh external content'
          git pull --rebase origin "$TARGET_BRANCH"
          git push
          # Bot pushes do not trigger push workflows; dispatch the full site build.
          gh workflow run deploy.yml --ref "$TARGET_BRANCH"
